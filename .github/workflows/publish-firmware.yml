name: Build Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: python -m pip install platformio

      - name: Build firmware
        run: pio run -e waveshare-s3-lcd-169

      - name: Save firmware files
        uses: actions/upload-artifact@v4
        with:
          name: waveshare-169-firmware
          path: |
            .pio/build/waveshare-s3-lcd-169/*.bin
