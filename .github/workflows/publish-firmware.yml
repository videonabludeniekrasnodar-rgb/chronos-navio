name: Build Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: python -m pip install platformio

      - name: Build firmware
        run: pio run

      - name: Save firmware files
        uses: actions/upload-artifact@v4
        with:
          name: chronos-navio-binaries
          path: |
            .pio/build/*/*.bin
